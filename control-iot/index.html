<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#162c25">
  <title>Control | Excavadora IoT</title>
  <link rel="icon" href="./assets/favicon/excavadora-192.png">
  <link rel="apple-touch-icon" href="./assets/favicon/excavadora-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/drive-controller.js" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body class="control-page">
  <header class="header">
    <a class="brand" href="./" aria-label="Excavadora IoT"><img src="./assets/favicon/excavadora-192.png" alt=""><span>Excavadora IoT</span></a>
    <button id="open-assist" type="button" class="subtle" aria-haspopup="dialog">IA</button>
    <button id="install" type="button" class="subtle" hidden>Instalar</button>
  </header>
  <main class="shell">
    <div class="title"><h1>Control de excavadora</h1><p class="status" id="status" aria-live="polite">Sin conexión</p></div>
    <form class="card login" id="login">
      <label for="token">Código de acceso</label>
      <input id="token" type="password" required minlength="8" maxlength="8" pattern="[A-Za-z0-9]{8}" autocomplete="off" placeholder="8 caracteres">
      <button type="submit" class="primary">Conectar</button>
      <label class="remember-code"><input id="remember-code" type="checkbox"> Recordar código en este dispositivo</label>
    </form>
    <section id="controls" class="console" hidden>
      <div class="toolbar card">
        <button id="arm" type="button" class="primary">Activar control</button>
        <button id="stop" type="button" class="danger">Parar</button>
        <button id="logout" type="button">Salir</button>
        <button id="open-bindings" type="button" aria-haspopup="dialog">Teclado y mando</button>
        <span id="device-status" class="muted" role="status">Consultando la placa</span>
      </div>
      <div class="stick-grid">
        <section class="card stick-card">
          <div class="stick-label"><h2>Vehículo</h2><span>W A S D</span></div>
          <div class="stick-area">
            <div class="stick" id="vehicle-stick" role="group" aria-label="Joystick del vehículo">
              <span class="north">↑</span><span class="west">←</span><span class="east">→</span><span class="south">↓</span><span class="knob"></span>
            </div>
          </div>
          <div class="stick-legend"><span>Avanzar</span><span>Girar</span><span>Retroceder</span></div>
        </section>
        <section class="card stick-card">
          <div class="stick-label"><h2>Pala</h2><span>↑ ← ↓ →</span></div>
          <div class="stick-area">
            <div class="stick" id="bucket-stick" role="group" aria-label="Joystick de la pala">
              <span class="north">↑</span><span class="west">←</span><span class="east">→</span><span class="south">↓</span><span class="knob"></span>
            </div>
          </div>
          <div class="stick-legend"><span>Agarrar</span><span>Girar</span><span>Soltar</span></div>
        </section>
      </div>
      <section class="card actions" aria-label="Funciones">
        <div class="button-grid">
          <button type="button" data-code="7">Luz</button><button type="button" data-code="6">Velocidad</button>
          <button type="button" data-code="5">Mute</button><button type="button" data-code="9">Encender</button>
          <button type="button" data-code="14">Apagar</button>
        </div>
      </section>
      <section class="card demo">
        <select id="demo" aria-label="Demo guardada"><option value="">Selecciona una demo</option></select>
        <button type="button" class="primary" id="run-demo">Ejecutar demo</button>
      </section>
    </section>
    <p id="notice" class="notice" aria-live="polite"></p>
  </main>
  <dialog class="card" id="key-settings" aria-labelledby="key-title">
    <div class="dialog-content">
      <h2 id="key-title">Teclado y mando</h2>
      <p id="gamepad" class="muted">Pulsa un botón del mando para detectarlo.</p>
      <div class="binding-grid">
        <label for="binding-action">Acción</label>
        <select id="binding-action"></select>
        <label for="binding-key">Tecla</label>
        <input id="binding-key" readonly>
      </div>
      <p id="binding-notice" class="notice" aria-live="polite"></p>
      <form method="dialog" class="dialog-actions">
        <button id="reset-keys" type="button">Restaurar teclas</button>
        <button class="primary">Cerrar</button>
      </form>
    </div>
  </dialog>
  <dialog class="card" id="assist-settings" aria-labelledby="assist-title">
    <div class="dialog-content">
      <h2 id="assist-title">Control con IA</h2>
      <div class="assist-options">
        <button type="button" id="voice-control" disabled>Comandos por voz</button>
        <button type="button" id="gesture-control" disabled>Gestos con cámara</button>
      </div>
      <p class="muted">En preparación</p>
      <form method="dialog" class="dialog-actions">
        <button class="primary">Cerrar</button>
      </form>
    </div>
  </dialog>
</body>
</html>
