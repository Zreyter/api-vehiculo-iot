<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162c25">
  <title>Monitor | Excavadora IoT</title>
  <link rel="icon" href="./assets/favicon/excavadora-192.png">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/monitor.js"></script>
</head>
<body class="monitor-page">
  <header class="header">
    <a class="brand" href="./"><img src="./assets/favicon/excavadora-192.png" alt="">Excavadora IoT</a>
    <nav class="main-nav" aria-label="Páginas">
      <a href="./">Control</a><a href="./monitor.html" aria-current="page">Monitor</a>
      <a data-swagger aria-label="Documentación de la API">API</a>
    </nav>
  </header>
  <main class="shell">
    <div class="title page-heading">
      <h1>Actividad del vehículo</h1>
      <p class="status" id="status" data-state="offline" aria-live="polite">Sin conexión</p>
    </div>
    <form class="card login" id="login" method="post" autocomplete="on">
      <input type="hidden" name="username" autocomplete="username" value="Excavadora IoT">
      <div class="login-field">
        <label for="token">Código de acceso</label>
        <div class="login-code">
          <input id="token" name="password" type="password" autocomplete="current-password"
            required minlength="8" maxlength="8" pattern="[A-Za-z0-9]{8}" placeholder="8 caracteres"
            autocapitalize="none" spellcheck="false" enterkeyhint="go">
          <button type="button" class="login-reveal" aria-controls="token" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <button type="submit" class="primary login-connect" disabled>Conectar</button>
      <label class="remember-code"><input id="remember-code" type="checkbox"> Recordar código en este dispositivo</label>
    </form>
    <div id="monitor" hidden>
      <section class="card monitor-card">
        <div class="section-title"><h2>Últimos 10 movimientos</h2><button id="logout" type="button">Salir</button></div>
        <div class="table-scroll"><table>
          <thead><tr><th>Hora</th><th>Código</th><th>Movimiento</th><th>Origen</th></tr></thead>
          <tbody id="movements"></tbody>
        </table></div>
      </section>
      <section class="card monitor-card">
        <div class="section-title">
          <h2>Mensajes en vivo</h2>
          <label><input id="heartbeat" type="checkbox"> Mostrar mensajes de conexión</label>
        </div>
        <ol id="frames" class="frames"></ol>
        <p id="empty-frames" class="muted">Esperando actividad de la API o el ESP8266.</p>
      </section>
    </div>
    <p id="notice" class="notice" aria-live="polite"></p>
  </main>
  <footer class="site-footer">
    <span>Jose Efren Quintanilla Morales</span>
    <a class="linkedin-link" href="https://www.linkedin.com/in/jose-efren-quintanilla-morales"
      rel="noreferrer" aria-label="Ver el perfil de Jose Efren Quintanilla Morales en LinkedIn">
      <img src="./assets/linkedin-in.png" width="28" height="24" alt="">
    </a>
    <a class="github-link" href="https://github.com/Zreyter"
      rel="noreferrer" aria-label="Ver el perfil de Jose Efren Quintanilla Morales en GitHub">
      <img src="./assets/github-mark.png" width="25" height="24" alt="">
    </a>
  </footer>
</body>
</html>
