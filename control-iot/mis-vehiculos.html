<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162c25">
  <title>Mis vehículos | Excavadora IoT</title>
  <link rel="icon" href="./assets/favicon/excavadora-192.png">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/administracion.css">
  <script type="module" src="./js/mis-vehiculos.js"></script>
</head>
<body class="monitor-page admin-page">
  <header class="header">
    <a class="brand" href="./"><img src="./assets/favicon/excavadora-192.png" alt="">Excavadora IoT</a>
    <nav class="main-nav" aria-label="Páginas"><a href="./">Control</a><a href="./monitor.html">Monitoreo</a><a href="./mis-vehiculos.html" aria-current="page">Mis vehículos</a><a href="./administracion.html" data-comercial hidden>Administración</a></nav>
  </header>
  <main class="shell">
    <div class="section-title"><h1>Mis vehículos</h1><button type="button" id="salir" hidden>Cerrar sesión</button></div>
    <p id="aviso" role="status" aria-live="polite"></p>
    <form id="acceso" class="card admin-form" hidden>
      <h2>Acceso de comprador</h2>
      <label>Correo electrónico<input name="correo" type="email" maxlength="254" autocomplete="username" required></label>
      <label>Contraseña<input name="clave" type="password" maxlength="256" autocomplete="current-password" required></label>
      <button class="primary">Ingresar</button>
    </form>
    <div id="unidades" class="unidades-personales"></div>
    <button type="button" id="actualizar" hidden>Actualizar unidades</button>
  </main>
  <footer class="site-footer">Desarrollado por Jose Efren Quintanilla Morales · 2026</footer>
</body>
</html>
